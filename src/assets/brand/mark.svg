<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 100" fill="none" role="img" aria-label="Sales Process">
  <title>Sales Process</title>
  <!--
    Mark ricostruito in vettoriale dalla misurazione del logo originale
    (4118x1001 px, componenti connesse sul canale alpha).
    CINQUE quadrati arrotondati in scalinata discendente, di lato decrescente:
      30.4 → 25.2 → 21.0 → 17.4 → 14.2   (rapporto costante ~0.83)
    Ogni quadrato porta data-i per essere indirizzato singolarmente dal
    motion system: i moduli sono la particella elementare del brand.
    Raggio 22% del lato, come nell'originale.
  -->
  <g fill="currentColor">
    <rect data-i="0" x="23.6" y="0"    width="30.4" height="30.4" rx="6.7"/>
    <rect data-i="1" x="0"    y="30.4" width="25.2" height="25.2" rx="5.5"/>
    <rect data-i="2" x="21.4" y="53.8" width="21.0" height="21.0" rx="4.6"/>
    <rect data-i="3" x="40.6" y="72.6" width="17.4" height="17.4" rx="3.8"/>
    <rect data-i="4" x="29.4" y="85.8" width="14.2" height="14.2" rx="3.1"/>
  </g>
</svg>
