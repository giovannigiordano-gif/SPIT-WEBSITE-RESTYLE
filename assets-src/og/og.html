<!doctype html>
<!-- L'immagine di condivisione (1200×630): si rigenera con
     tools/og.mjs. Logo vero, H1 della home, il braccio che alza il cubo. -->
<html lang="it"><head><meta charset="utf-8"><style>
@font-face { font-family: 'DM Sans'; src: url('../../src/assets/fonts/dm-sans-latin-var.woff2') format('woff2'); font-weight: 100 1000; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #161519; }
.c { position: relative; width: 1200px; height: 630px; font-family: 'DM Sans', sans-serif; color: #F8F8F8; overflow: hidden; }
.c::before { content: ''; position: absolute; left: 520px; top: 120px; width: 900px; height: 820px;
  background: radial-gradient(50% 50% at 50% 60%, rgba(184,91,0,.55), rgba(184,91,0,0) 70%); }
.c::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 160px rgba(0,0,0,.45); }
.logo { position: absolute; left: 76px; top: 70px; height: 52px; }
h1 { position: absolute; left: 76px; top: 196px; margin: 0; width: 660px; font-weight: 700; font-size: 80px; line-height: .98; letter-spacing: -.035em; }
h1 span { color: #FF8200; }
.foto { position: absolute; right: 56px; bottom: -70px; height: 700px; z-index: 1;
  -webkit-mask-image: linear-gradient(180deg, #000 74%, transparent 98%); mask-image: linear-gradient(180deg, #000 74%, transparent 98%); }
</style></head><body><div class="c">
<img class="logo" src="../../src/assets/brand/logo-full-h112.webp" alt="">
<h1>Ti consegniamo il reparto che <span>fattura.</span></h1>
<img class="foto" src="../../src/assets/foto/finale-trofeo-1200.webp" alt="">
</div></body></html>
